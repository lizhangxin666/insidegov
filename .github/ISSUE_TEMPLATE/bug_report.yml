name: Bug report
description: 报告可复现的问题
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 代码版本或 commit
  - type: input
    id: seed
    attributes:
      label: 场景与随机种子
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true

