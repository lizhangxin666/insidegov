[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "insidegov"
version = "0.1.0"
description = "A reproducible multi-agent policy laboratory for government-business interaction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "InsideGov contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1", "httpx>=0.28,<1"]

[project.scripts]
insidegov = "insidegov.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/insidegov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

